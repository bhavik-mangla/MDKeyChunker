[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdkeychunker"
version = "0.3.0"
description = "Markdown chunking with LLM enrichment for RAG pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bhavik Mangla"}
]
keywords = ["markdown", "chunking", "rag", "llm", "retrieval-augmented-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core: chunk, window, evidence metrics, fusion maths, diagnose report logic. No dependencies.
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0.0"]                        # OpenAI and compatible servers (Ollama, vLLM, ...)
anthropic = ["anthropic>=0.40.0"]
tokens = ["tiktoken>=0.8.0"]                   # exact token counts (cl100k_base, the study's)
bm25 = ["bm25s>=0.2.0", "PyStemmer>=2.2.0.3"]  # first with cp310-cp313 wheels
dense = ["sentence-transformers>=3.0.0", "transformers>=4.51.0"]   # 4.51: Qwen3 models
rerank = ["sentence-transformers>=3.0.0", "transformers>=4.51.0"]  # CrossEncoder, Qwen3 seq-cls
retrieval = ["mdkeychunker[bm25,dense,rerank]"]
langchain = ["langchain-text-splitters>=0.3.0"]   # TextSplitter; pulls in langchain-core
llamaindex = ["llama-index-core>=0.12.0"]
spacy = ["spacy>=3.0.0"]           # experimental, not covered by the study; also run:
                                   # python -m spacy download en_core_web_md
cli = ["python-dotenv>=1.0.0"]     # .env support for the CLI
all = ["mdkeychunker[llm,anthropic,tokens,retrieval,langchain,llamaindex,cli]"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "markdown-it-py>=3.0.0",
    "pytest-examples>=0.0.10",
]
benchmark = [
    "sentence-transformers>=2.2.0",
    "datasets>=2.14.0",
    "beir>=2.0.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
mdkeychunker = "mdkeychunker.cli:main"

[project.urls]
Homepage = "https://github.com/bhavik-mangla/MDKeyChunker"
Repository = "https://github.com/bhavik-mangla/MDKeyChunker"
Issues = "https://github.com/bhavik-mangla/MDKeyChunker/issues"
Changelog = "https://github.com/bhavik-mangla/MDKeyChunker/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdkeychunker*"]

[tool.setuptools.package-data]
mdkeychunker = ["py.typed"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
